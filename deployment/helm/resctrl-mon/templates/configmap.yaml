apiVersion: v1
kind: ConfigMap
metadata:
  name: nri-resctrl-mon-config.default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nri-plugin.labels" . | nindent 4 }}
data:
  config.yaml: |
    resctrlPath: {{ .Values.resctrlPath }}
    groupBy: {{ .Values.groupBy | default "pod" }}
    namespaces: []
    labelSelector: {}
    telemetry:
      {{- toYaml .Values.telemetry | nindent 6 }}
